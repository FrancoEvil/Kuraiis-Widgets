name: Windows build and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Decide whether this version needs a release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $assets = gh release view "v$version" --repo '${{ github.repository }}' --json assets --jq '.assets[].name' 2>$null
          $required = @("Kuraiis-Playing-Setup-$version.exe", "Kuraiis-Playing-Setup-$version.exe.blockmap", 'latest.yml')
          if ($LASTEXITCODE -eq 0 -and @($required | Where-Object { $_ -notin $assets }).Count -eq 0) {
            'publish=false' >> $env:GITHUB_OUTPUT
          } else {
            'publish=true' >> $env:GITHUB_OUTPUT
          }
          exit 0
      - name: Build installer and update metadata
        run: npm run dist
      - name: Publish complete GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: ./scripts/publish-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Kuraiis-Playing-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
